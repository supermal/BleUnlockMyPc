# Genera el instalador en la nube y lo publica en Releases.
# - Al empujar una etiqueta vX.Y.Z: pruebas → instalador → versión publicada en Releases con el .exe.
# - «Run workflow» a mano (pestaña Actions): lo mismo, pero solo deja el .exe como artefacto descargable,
#   sin publicar nada (sirve para comprobar que la compilación en la nube funciona).
# La plantilla appsettings.json sale de git, así que el paquete nunca lleva credenciales locales.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # crear la versión en Releases y subir el instalador

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (historial completo: MinVer saca la versión de las etiquetas)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup 6
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 no se pudo instalar' }

      - name: Tests
        shell: powershell
        run: |
          dotnet test tests/BleUnlockService.Tests/BleUnlockService.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/BleUnlockManager.Tests/BleUnlockManager.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # El proyecto C++ usa v145 (VS 2026); si la imagen solo trae VS 2022 se compila con v143
      - name: C++ toolset
        id: toolset
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          Write-Host "Visual Studio $vs"
          $toolset = if ($vs -and ([version]$vs).Major -ge 18) { '' } else { 'v143' }
          "value=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Ejecutado a mano (sin etiqueta), el script crea una etiqueta local para la versión: git pide autor
      - name: Build installer
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          ./installer/build-installer.ps1 -PlatformToolset '${{ steps.toolset.outputs.value }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BleUnlock-Setup
          path: installer/out/BleUnlock-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $setup = Get-ChildItem installer/out -Filter 'BleUnlock-Setup-*.exe' | Select-Object -First 1
          gh release create $tag $setup.FullName --title "BleUnlock $($tag.TrimStart('v'))" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
